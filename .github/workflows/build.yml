name: Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --filter TestCategory=unit

      - name: Publish
        run: dotnet publish cgf-converter/cgf-converter.csproj -c Release -o publish

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cgf-converter
          path: publish
